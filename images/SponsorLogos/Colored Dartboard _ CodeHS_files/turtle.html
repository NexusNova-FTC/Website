            function isEmptyCanvas(canvas) {
                var ctx = canvas.getContext('2d');
                var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                var data = imageData.data;
                return data.every(function(value) {
                    return value === 0;
                });
            };

            function builtinRead(files, x) {
                if (Sk.builtinFiles['files'][x]) {
                    return Sk.builtinFiles['files'][x];
                } else {
                    return files.filter(function (file) {
                        return file.name === x.split('/').pop();
                    })[0].text;
                }
            }

            function output(text) {
                postToParent({type: 'program_stdout', stdout: text});
            }

            function input(prompt) {
                postToParent({type: 'program_stdout', stdout: prompt});
                return new Promise((resolve, reject) => {
                    window.addEventListener('message', ({data}) => {
                        if (data.type === 'stdin') {
                            resolve(data.data);
                        }
                    });
                });
            }

            function centerCanvas() {
                // if canvas hasn't loaded, try in 300 ms
                if (
                    target.scrollHeight === target.clientHeight &&
                    target.scrollWidth === target.clientWidth
                ) {
                    setTimeout(centerCanvas, 300);
                }
                target.scrollTop = target.scrollHeight / 2 - target.clientHeight / 2;
                target.scrollLeft = target.scrollWidth / 2 - target.clientWidth / 2;
